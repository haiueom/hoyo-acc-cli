[project]
name = "hoyo-acc-cli"
version = "0.1.0"
description = "A simple cli app to interact with hoyo-acc api"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pyinstaller>=6.19.0",
    "ruff>=0.15.10",
]

# pyproject.toml

[tool.ruff]
# Target versi Python (sesuaikan dengan environment Anda)
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# E: Pycodestyle, F: Pyflakes, I: Isort (Import sorting), UP: Pyupgrade, B: Bugbear
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
