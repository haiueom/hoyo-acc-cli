# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: main
  pull_request:
    branches: main

jobs:
  quality-check:
    name: Quality Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Ruff Formatter (Check only)
        run: uv run ruff format --check .

      # Opsional: Coba build exe untuk memastikan tidak ada error saat packaging
      - name: Test Build Executable
        run: uv run pyinstaller --onefile --collect-all rich --name hoyo-cli-test client.py
